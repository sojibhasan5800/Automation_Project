{% extends 'base.html' %}
{% load static %}

{% block extra_title %}
<title>Play | {{ room_code }}</title>
{% endblock %}

{% block extra_css %}
<link href="{% static 'css/tictac.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="full-page bg-dark" id="full-page">
    <div class="game flex-column">
        <div class="scoreboard">
            <div class="player1">Player 1: 0</div>
            <div class="player2">Player 2: 0</div>
        </div>
        <div class="boardcontainer">
            <div class="board">
                {% for i in "012345678" %}
                <div data-cell-index="{{ forloop.counter0 }}" class="space"></div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script>
    // ================== Variables ==================
    var room_code = '{{ room_code }}';
    var username = '{{ username }}';
    var player = username.charAt(0); // X or O
    var gameState = ["","","","","","","","",""];
    var gameOver = false; // Game is over → clicks are disabled
    var myTurn = true; // ✅ The player who opens the page plays first

    console.log("Username:", username);

    const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(
        wsScheme + "://" + window.location.host + "/tictacs/ws/game/" + room_code + "/"
    );

    let elementArray = document.querySelectorAll('.space');

    elementArray.forEach(function(elem){
        elem.addEventListener("click", function(event){
            let index = event.currentTarget.getAttribute('data-cell-index');
            setText(index, player);
        });
    });

    // ================== Functions ==================
    function setText(index, value){
        if(gameOver) return; // Clicks disabled if the game is over
        if(!myTurn){
            alert("Wait! It's not your turn."); // ✅ Turn check
            return;
        }

        if(gameState[parseInt(index)] === ""){
            gameState[parseInt(index)] = value;
            elementArray[parseInt(index)].innerHTML = value;

            var data = {
                player: value,
                index: index,
                type: 'running'
            };

            socket.send(JSON.stringify({data}));

            myTurn = false; // ✅ Switch turn after making a move
            checkWon(value, player);
        } else {
            alert("You cannot fill this space"); // Already filled
        }
    }

    function setAnotherUserText(index, value){
        gameState[parseInt(index)] = value;
        elementArray[parseInt(index)].innerHTML = value;
        myTurn = true; // ✅ After the other player's move, it's my turn
    }

    function checkGameEnd(){
        let count = gameState.filter(cell => cell !== "").length;
        if(count >= 9 && !gameOver){
            gameOver = true;
            var data = {'type': 'over'};
            socket.send(JSON.stringify({data}));
            swal("Game over!", "No one won", "warning");
        }
    }

    function checkWon(value, player){
        const winPatterns = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        let won = winPatterns.some(pattern => 
            pattern.every(index => gameState[index] === value)
        );

        if(won){
            gameOver = true;
            var data = {'type': 'end', 'player': player};
            socket.send(JSON.stringify({data}));
            swal("Good job!", "You won", "success");
        }

        checkGameEnd();
    }

    // ================== WebSocket ==================
    socket.onopen = function(e){
        console.log("Socket connected!");
    };

    socket.onmessage = function(e){
        var data = JSON.parse(e.data);
        console.log("WS message:", data);

        if(data.payload.type === 'end'){
            gameOver = true;
            if(data.payload.player !== player){
                swal("Sorry!", "You lost", "error");
            }
        } else if(data.payload.type === 'over'){
            gameOver = true;
            swal("Game over!", "No one won", "warning");
        } else if(data.payload.type === 'running' && data.payload.player !== player){
            // Other player's move received → set text + now it's my turn
            setAnotherUserText(data.payload.index, data.payload.player);
        }
    };

    socket.onclose = function(e){
        console.log("Socket closed");
    };
</script>
{% endblock %}
