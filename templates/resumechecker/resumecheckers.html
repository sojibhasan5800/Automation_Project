

{% extends 'base.html' %}
{% load static %}


{% block content %}

    <div class="container mt-3">
  <div class="card p-4">
    <h3 class="mb-3 text-center">Upload a PDF</h3>

    <!-- Job Description Dropdown -->
    <div class="mb-3">
      <label class="form-label">Select Job Description:</label>
      <select id="jobDescription" class="form-select"></select>
    </div>

    <!-- Resume Upload -->
    <div class="mb-3">
      <label class="form-label">Upload Resume (PDF):</label>
      <input type="file" id="resumeFile" class="form-control" accept="application/pdf">
    </div>

    <div class="text-center">
      <button id="uploadBtn" class="btn btn-primary">UPLOAD</button>
    </div>

    <!-- Progress -->
    <div class="mt-3" id="progress" style="display:none;">
      <p>Uploading: <span id="uploadPercent">0%</span></p>
      <div class="progress">
        <div class="progress-bar" role="progressbar" style="width: 0%;" id="progressBar"></div>
      </div>
    </div>

    <!-- Result -->
    <div id="result" class="mt-4" style="display:none;">
      <h5>Rank: <span id="rank"></span></h5>
      <h6>Total Experience: <span id="experience"></span></h6>

      <div class="mt-2">
        <strong>Skills:</strong>
        <div id="skills"></div>
      </div>

      <div class="mt-2">
        <strong>Project Categories:</strong>
        <div id="projects"></div>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block extra_css %}
<link href="{% static 'css/resumecheckers.css' %}" rel="stylesheet">
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/resumecheckers.js' %}"></script>
{% endblock %}
