{% load static %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automate The Boring Stuff With Django</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" ></script>

    <!-- JQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    
    <script src="{% static 'js/custom.js' %}"></script>

    <!-- CKEditor Scripts -->
    <script type="text/javascript" src="{% static 'ckeditor/ckeditor-init.js' %}"></script>
    <script type="text/javascript" src="{% static 'ckeditor/ckeditor/ckeditor.js' %}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
      .form-group{
        padding: 15px !important;
      }
      .home-info{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px;
      }
   
.social-login-container {
    max-width: 400px;
    margin: 40px auto;
    text-align: center;
    font-family: Arial, sans-serif;
}

/* Divider */
.divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin-bottom: 25px;
    color: #555;
    font-weight: bold;
}
.divider::before,
.divider::after {
    content: "";
    flex: 1;
    border-top: 1px solid #ccc;
}
.divider span {
    margin: 0 12px;
    font-size: 14px;
}

/* Buttons */
.social-buttons {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    transition: background 0.3s ease, color 0.3s ease;
}

/* Icon */
.icon {
    width: 22px;
    height: 22px;
}

/* GitHub Button (white background, black text & icon) */
.github-btn {
    background: #fff;
    color: #24292e;
    border: 2px solid #24292e;
}
.github-btn:hover {
    background: #d4343440;
}

/* Facebook Button (brand blue) */
.facebook-btn {
    background: #1877f2;
    color: #fff;
    border: none;
}
.facebook-btn:hover {
    background: #0d5bd7;
}

/* Responsive */
@media (max-width: 480px) {
    .social-login-container {
        width: 90%;
    }
    .btn {
        font-size: 14px;
        padding: 12px;
    }
}



    </style>

</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container">
          <a class="navbar-brand" href="{% url 'home' %}">Automate With Django</a>
          
          {% if user.is_authenticated %}
          <!-- show logout button -->
          <div>
            Logged in as: <b>{{ user }}</b>
            &nbsp;<a href="{% url 'account:logout' %}" class="float-right btn btn-outline-danger">Logout</a>
          </div>
          {% else %}
          <div>
            <a href="{% url 'account:login' %}" class="float-right text-decoration-none text-dark">Login</a>
            &nbsp;<a href="{% url 'account:register' %}" class="float-right btn btn-success">Register</a>
          </div>
          {% endif %}
        </div>
    </nav> 

    {% block content %}
        <!-- All your html main content will go here -->
    {% endblock %}

</body>
</html>
